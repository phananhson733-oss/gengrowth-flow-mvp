name: smoke-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run smoke test suite (pure node --test, zero npm deps)
        run: node --test 'tools/scripts/__tests__/*.test.mjs'

      - name: Verify red-lines + structure pass on bundled v8 example article
        run: |
          # Bundled Saturn Return v8 (Claude) was 6/6 PASS under v8 standard.
          # Re-run via the generalized validator to catch any lib regression.
          node tools/scripts/_phase2-validate.mjs \
            --source _staging/page_saturn_return-claude-v8.md \
            --page-id page_saturn_return \
            --entity "Saturn Return" \
            --target-keyword "saturn return" \
            --expected-h2 5 \
            --psych-safety transit \
            --llm-source "Claude Opus 4.7" \
            --prompt-version v8 \
            --tag ci-verify
