          - heading "Questions People Ask About the Full Moon" [level=2] [ref=e234]
          - paragraph [ref=e235]:
            - strong [ref=e236]: What does the full moon mean spiritually?
          - paragraph [ref=e237]: Spiritually, the full moon is often read as a point of culmination and clear seeing, the moment a cycle reaches its peak. Many traditions use it to reflect on what has come to light since the new moon and what is finally ready to be released.
          - paragraph [ref=e238]:
            - strong [ref=e239]: Do full moons actually affect humans?
          - paragraph [ref=e240]: Secular framing treats reported full moon reactivity as coincidence rather than proven cause, and that is a fair scientific caution to keep. Used as a symbolic timing cue instead of a claim about biology, the pattern can still support genuine self-reflection.
          - paragraph [ref=e241]:
            - strong [ref=e242]: What are some simple full moon ritual ideas?
          - paragraph [ref=e243]: Common practices include journaling about what came to a head this month, naming one thing you are ready to release, and revisiting the intentions you set at the new moon. The point is structured reflection on a regular rhythm, not a fixed or elaborate formula.
          - paragraph [ref=e244]:
            - strong [ref=e245]: Why do I feel more emotional during a full moon?
          - paragraph [ref=e246]: The full moon lines up with the brightest part of the cycle, which many people experience as a surge in whatever they were already carrying. Noticing the timing tends to make that intensity easier to hold rather than more alarming.
          - heading "Reflection Prompts" [level=2] [ref=e247]
          - generic [ref=e248]:
            - generic [ref=e249]: "1."
            - generic [ref=e250]: Think back to a recent full moon week — which feeling got suddenly louder, and when had it first started building?
          - generic [ref=e251]:
            - generic [ref=e252]: "2."
            - generic [ref=e253]: Recall a decision that turned clear around a full moon; what had the brighter light finally let you admit?
          - generic [ref=e254]:
            - generic [ref=e255]: "3."
